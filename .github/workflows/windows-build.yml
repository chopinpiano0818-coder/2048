name: Build Windows 2048

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install SDL
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install sdl2:x64-windows sdl2-ttf:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item build\Release\2048.exe package\

          Get-ChildItem vcpkg\installed\x64-windows\bin\*.dll |
            ForEach-Object {
              Copy-Item $_.FullName package\ -Force
            }

          Compress-Archive package\* 2048-windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 2048-windows
          path: 2048-windows.zip
